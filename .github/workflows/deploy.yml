name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [labs-update]   # sent by notify-labs.yml in each app repo
  schedule:
    - cron: '0 */6 * * *'  # safety net
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pull latest commit of every app repo (skipped on plain pushes so a pinned SHA deploys as-is).
      - name: Update submodules
        if: github.event_name != 'push'
        run: git submodule update --init --remote

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm install -g pnpm@11   # some apps (gmaps-simulation) use pnpm
      - run: npm run build
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
